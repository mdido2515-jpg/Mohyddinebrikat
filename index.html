const byId = (arr, id) => state[arr].find(x => x.id === id);
const catName = id => (byId('categories', id) || {}).name || '—';
const eqName = id => { const e = byId('equipment', id); return e ? `${e.name} (${e.code})` : '—'; };
const matOf = id => byId('materials', id);
const supName = id => (byId('suppliers', id) || {}).name || '—';

/* =====================================================
   الحسابات
   ===================================================== */
function catSpent(c) { return c.opening + state.expenses.filter(e => e.cat === c.id).reduce((s, e) => s + e.amount, 0); }
function budgetTotals() {
  const budget = state.categories.reduce((s, c) => s + c.budget, 0);
  const spent = state.categories.reduce((s, c) => s + catSpent(c), 0);
  return { budget, spent, left: budget - spent, pct: budget ? spent / budget * 100 : 0 };
}
function monthIndex(dateStr) { const d = D(dateStr); return (d.getFullYear() - CHART_START.y) * 12 + d.getMonth() - CHART_START.m; }
function monthlyActual() {
  const arr = state.monthlyBase.slice();
  state.expenses.forEach(e => { const i = monthIndex(e.date); if (i >= 0 && i < arr.length) arr[i] += e.amount; });
  return arr;
}
function payroll() {
  const week = state.workers.reduce((s, w) => s + w.dailyWage * w.daysWeek, 0);
  const month = state.workers.reduce((s, w) => s + w.dailyWage * w.daysMonth, 0);
  return { week, month };
}
function progressStats() {
  const tw = state.milestones.reduce((s, m) => s + m.w, 0) || 1;
  let act = 0, plan = 0;
  state.milestones.forEach(m => {
    act += m.w * m.progress / 100;
    const s = D(m.pStart), e = D(m.pEnd);
    plan += m.w * (e > s ? clamp((TODAY - s) / (e - s), 0, 1) : (TODAY >= e ? 1 : 0));
  });
  return { act: act / tw * 100, plan: plan / tw * 100 };
}
function msStatus(m) {
  if (m.progress >= 100) return ['done', 'مكتملة', 'ok'];
  if (TODAY > D(m.pEnd)) return ['late', 'متأخرة', 'bad'];
  if (m.progress > 0 || TODAY >= D(m.pStart)) return ['active', 'قيد التنفيذ', 'warn'];
  return ['todo', 'لم تبدأ', 'mute'];
}
function msDelay(m) {
  const end = m.aEnd || m.fEnd;
  if (!end) return null;
  return daysBetween(D(end), D(m.pEnd));
}
function materialStatus(m) {
  const days = m.daily > 0 ? m.qty / m.daily : Infinity;
  let key = 'ok';
  if (m.qty < m.min * 0.5 || days <= m.lead) key = 'critical';
  else if (m.qty < m.min || days <= m.lead + 3) key = 'low';
  const map = { ok: ['متوفر', 'ok'], low: ['منخفض', 'warn'], critical: ['حرج', 'bad'] };
  return { key, label: map[key][0], cls: map[key][1], days };
}
function suggestQty(m) {
  const target = Math.max(m.min * 2, m.daily * (m.lead + 14));
  return Math.max(Math.ceil((target - m.qty) * 10) / 10, 1);
}
function evm() {
  const bt = budgetTotals(), ps = progressStats();
  const EV = bt.budget * ps.act / 100, AC = bt.spent;
  const CPI = AC > 0 ? EV / AC : 1;
  const EAC = ps.act > 0 && CPI > 0 ? bt.budget / CPI : bt.budget;
  return { EV, AC, CPI, EAC, VAC: bt.budget - EAC, SPI: ps.plan > 0 ? ps.act / ps.plan : 1, bt, ps };
}
function safetyDays() {
  const inj = state.log.filter(l => l.injuries > 0).map(l => D(l.date)).sort((a, b) => b - a);
  const first = state.milestones.length ? D(state.milestones.map(m => m.pStart).sort()[0]) : TODAY;
  const ref = inj[0] || first;
  return { days: Math.max(0, daysBetween(TODAY, ref)), last: inj[0] || null };
}
function computeRisks() {
  const ps = progressStats(), items = [];
  const ms = [...state.milestones].sort((a, b) => D(a.pStart) - D(b.pStart));
  const start = ms.length ? D(ms[0].pStart) : TODAY;
  const end = ms.length ? new Date(Math.max(...ms.map(m => D(m.pEnd)))) : TODAY;
  let maxMs = 0;
  ms.forEach(m => {
    const st = msStatus(m)[0];
    if (st === 'done') return;
    const dl = msDelay(m);
    const lateNow = st === 'late';
    const days = dl !== null && dl > 0 ? dl : (lateNow ? daysBetween(TODAY, D(m.pEnd)) : 0);
    if (days > 0) {
      maxMs = Math.max(maxMs, days);
      items.push({ lvl: lateNow || days > 14 ? 'high' : 'med', text: `مرحلة «${esc(m.name)}»: تأخر ${lateNow ? 'حالي' : 'متوقع'} بحوالي ${days} يوم` });
    }
  });
  const totalDur = daysBetween(end, start);
  const spi = ps.plan > 0 ? ps.act / ps.plan : 1;
  const spiDelay = spi < 1 ? Math.round(totalDur / spi - totalDur) : 0;
  const delayDays = Math.max(spiDelay, maxMs, 0);
  const projectedEnd = new Date(end.getTime() + delayDays * DAY);

  const matRisk = state.materials.filter(m => materialStatus(m).key !== 'ok');
  if (matRisk.length) items.push({ lvl: matRisk.some(m => materialStatus(m).key === 'critical') ? 'high' : 'med', text: `${matRisk.length} مواد قد تعطّل الأشغال إن لم تُطلب: ${matRisk.map(m => esc(m.name)).join('، ')}` });
  const down = state.equipment.filter(e => e.status === 'stopped');
  if (down.length) items.push({ lvl: 'med', text: `${down.length} معدات متوقفة: ${down.map(e => esc(e.name)).join('، ')}` });
  const absent = state.workers.filter(w => w.status === 'absent').length;
  if (state.workers.length && absent / state.workers.length >= 0.15) items.push({ lvl: 'med', text: `نقص في اليد العاملة: ${Math.round(absent / state.workers.length * 100)}% من العمال غائبون اليوم` });
  const ev = evm();
  if (ev.VAC < 0) items.push({ lvl: -ev.VAC > ev.bt.budget * 0.05 ? 'high' : 'med', text: `تجاوز متوقع للميزانية بمقدار ${mil(-ev.VAC)}` });
  const level = items.some(i => i.lvl === 'high') ? 'high' : items.length ? 'med' : 'low';
  return { items, delayDays, projectedEnd, plannedEnd: end, level, spi };
}
function getAlerts() {
  const a = [];
  state.materials.forEach(m => {
    const s = materialStatus(m);
    if (s.key === 'ok') return;
    const pend = state.orders.some(o => o.matId === m.id && o.status === 'pending');
    a.push({ cls: s.key === 'critical' ? 'bg-brick' : 'bg-hivis', text: `مخزون ${esc(m.name)} ${s.label}: ${num(m.qty)} ${esc(m.unit)}${isFinite(s.days) ? ` — يكفي ${Math.floor(s.days)} يوم` : ''}${pend ? ' (طلب توريد قيد الانتظار)' : ''}`, go: 'materials' });
  });
  state.equipment.filter(e => e.status !== 'running').forEach(e => a.push({ cls: e.status === 'stopped' ? 'bg-brick' : 'bg-hivis', text: `${esc(e.name)} (${esc(e.code)}) ${EQ_STATUS[e.status][0]}`, go: 'equipment' }));
  state.maint.filter(m => !m.done && daysBetween(D(m.date), TODAY) <= 7).sort((x, y) => x.date.localeCompare(y.date)).forEach(m => {
    const d = daysBetween(D(m.date), TODAY);
    a.push({ cls: d < 0 ? 'bg-brick' : 'bg-hivis', text: `${m.type} لـ ${esc(eqName(m.eqId))}: ${d < 0 ? `متأخرة ${-d} يوم` : d === 0 ? 'اليوم' : `بعد ${d} يوم`}`, go: 'equipment' });
  });
  state.milestones.filter(m => msStatus(m)[0] === 'late').forEach(m => a.push({ cls: 'bg-brick', text: `مرحلة «${esc(m.name)}» متأخرة عن موعدها المخطط`, go: 'progress' }));
  const absent = state.workers.filter(w => w.status === 'absent').length;
  if (absent) a.push({ cls: 'bg-hivis', text: `${absent} عمال غائبون اليوم`, go: 'workers' });
  const ev = evm();
  if (ev.VAC < 0) a.push({ cls: 'bg-brick', text: `بهذا المعدل ستتجاوز الميزانية بـ ${mil(-ev.VAC)}`, go: 'budget' });
  return a;
}

function setWorkerStatus(w, st) {
  const today = iso(TODAY);
  if (st === 'absent') {
    if (w.lastCheck === today) { w.daysWeek = Math.max(0, w.daysWeek - 1); w.daysMonth = Math.max(0, w.daysMonth - 1); w.lastCheck = null; }
    w.checkIn = null;
  } else {
    if (!w.checkIn || w.lastCheck !== today) { const n = new Date(); w.checkIn = `${pad(n.getHours())}:${pad(n.getMinutes())}`; }
    if (w.lastCheck !== today) { w.daysWeek = Math.min(7, w.daysWeek + 1); w.daysMonth += 1; w.lastCheck = today; }
  }
  w.status = st;
}

function cashChartSVG() {
  const act = monthlyActual(), plan = state.monthlyPlan, n = plan.length;
  const nowIdx = monthIndex(iso(TODAY));
  const W = 760, H = 290, top = 14, bottom = 42, left = 8, right = 42;
  const maxV = Math.max(1, Math.ceil(Math.max(...plan, ...act.map(v => v / 1e6))));
  const pw = W - left - right, ph = H - top - bottom, band = pw / n, bw = band * 0.33;
  const y = v => top + ph - (v / maxV) * ph;
  let g = '';
  for (let i = 0; i <= maxV; i++) g += `<line x1="${left}" x2="${W - right}" y1="${y(i)}" y2="${y(i)}" stroke="#E8EBEC"/><text x="${W - right + 6}" y="${y(i) + 4}" font-size="11" fill="#5B6B77">${i}م</text>`;
  for (let i = 0; i < n; i++) {
    const cx = (W - right) - (i + 0.5) * band;
    const mo = (CHART_START.m + i) % 12, yr = CHART_START.y + Math.floor((CHART_START.m + i) / 12);
    const p = plan[i] || 0, a = act[i] / 1e6;
    const showA = i <= nowIdx || a > 0;
    g += `<rect x="${cx - bw - 1}" y="${y(p)}" width="${bw}" height="${Math.max(0, y(0) - y(p))}" fill="#A9B4BC"><title>${MONTHS[mo]} ${yr} — المخطط: ${p.toFixed(1)} مليون</title></rect>`;
    if (showA) g += `<rect x="${cx + 1}" y="${y(a)}" width="${bw}" height="${Math.max(0, y(0) - y(a))}" fill="${a > p ? '#B87F00' : '#F5A800'}"><title>${MONTHS[mo]} ${yr} — الفعلي: ${a.toFixed(2)} مليون</title></rect>`;
    g += `<text x="${cx}" y="${H - 22}" font-size="10" text-anchor="middle" fill="${i === nowIdx ? '#151E25' : '#2A3742'}" font-weight="${i === nowIdx ? 700 : 400}">${MONTHS[mo]}</text>`;
    if (i === 0 || mo === 0) g += `<text x="${cx}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#5B6B77">${yr}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="مخطط أعمدة يقارن المصاريف الشهرية الفعلية بالمخطط لها (بالملايين)">${g}</svg>
    <p class="text-xs text-steel-500 mt-1">القيم بالملايين (${CUR}). العمود الأغمق يعني تجاوز المخطط في ذلك الشهر.</p>`;
}

function download(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function exportCSV(key) {
  const E = EXPORTS[key];
  const rows = [E.head, ...E.rows()];
  const csv = '\uFEFFsep=;\n' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
  download(`${E.file}-${iso(TODAY)}.csv`, csv, 'text/csv;charset=utf-8');
  toast(`تم تصدير جدول ${E.file}`);
}
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {} ta.remove(); return Promise.resolve();
}

const modal = $('#modal');
let modalHandler = null;

function openModal({ title, message = '', fields = [], submit = 'حفظ', danger = false, onSubmit }) {
  $('#modalTitle').textContent = title;
  const msg = $('#modalMsg'); msg.textContent = message; msg.classList.toggle('hidden', !message);
  const sb = $('#modalSubmit'); sb.textContent = submit; sb.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
  $('#modalFields').innerHTML = fields.map(f => {
    const val = f.value ?? '';
    let input;
    if (f.type === 'select') input = `<select name="${f.name}" class="field" ${f.required ? 'required' : ''}>${f.options.map(o => `<option value="${esc(o.v ?? '')}" ${String(o.v ?? '') === String(val ?? '') ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea name="${f.name}" rows="3" class="field" ${f.required ? 'required' : ''}>${esc(val)}</textarea>`;
    else input = `<input name="${f.name}" type="${f.type || 'text'}" class="field" ${f.required ? 'required' : ''} ${f.list ? `list="${f.list}"` : ''}
             ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''} ${f.type === 'number' ? 'step="any"' : ''} value="${esc(val)}">`;
    return `<label class="block"><span class="block text-sm font-medium mb-1.5">${f.label}</span>${input}</label>`;
  }).join('');
  modalHandler = onSubmit;
  modal.showModal();
}
$('#modalForm').addEventListener('submit', e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  modal.close();
  if (modalHandler) modalHandler(data);
});
$('#modalCancel').addEventListener('click', () => modal.close());

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2800);
}

function commit(msg) { save(); refreshAll(); if (msg) toast(msg); }

function openForm(col, id, preset = {}) {
  const S = SCHEMA[col];
  const rec = id ? state[S.arr].find(x => x.id === id) : null;
  const dflt = S.defaults();
  const fields = S.fields().map(f => ({ ...f, value: rec ? rec[f.name] : (preset[f.name] ?? dflt[f.name]) }));
  openModal({
    title: (rec ? 'تعديل ' : 'إضافة ') + S.title, fields, submit: rec ? 'حفظ التعديلات' : 'إضافة',
    onSubmit: v => {
      const obj = {};
      S.fields().forEach(f => {
        let x = v[f.name];
        if (f.type === 'number') x = (x === '' || x === undefined) ? 0 : +x;
        else if (f.int) x = (x === '' || x === undefined) ? null : +x;
        else if (typeof x === 'string') { x = x.trim(); if (x === '' && f.nullable) x = null; }
        obj[f.name] = x;
      });
      let target;
      if (rec) { Object.assign(rec, obj); target = rec; }
      else { target = { id: nid(state[S.arr]), ...dflt, ...preset, ...obj }; state[S.arr].push(target); }
      if (S.after) S.after(target);
      if (col === 'workers' && !rec && target.status !== 'absent') { const st = target.status; target.status = 'absent'; setWorkerStatus(target, st); }
      commit(rec ? 'تم حفظ التعديلات' : 'تمت الإضافة');
    }
  });
}

function removeRecord(col, id) {
  const S = SCHEMA[col];
  if (col === 'categories' && state.expenses.some(e => e.cat === id)) { toast('لا يمكن حذف بند فيه مصاريف. احذف مصاريفه أو انقلها إلى بند آخر أولاً.'); return; }
  state[S.arr] = state[S.arr].filter(x => x.id !== id);
  if (col === 'equipment') state.maint = state.maint.filter(m => m.eqId !== id);
  if (col === 'materials') state.orders = state.orders.filter(o => o.matId !== id);
  if (col === 'suppliers') { state.materials.forEach(m => { if (m.supplierId === id) m.supplierId = null; }); state.orders.forEach(o => { if (o.supplierId === id) o.supplierId = null; }); }
  commit('تم الحذف');
}

function deferredRefresh() {
  setTimeout(() => {
    const a = document.activeElement, d = a && a.dataset;
    const sel = d && d.field ? `[data-col="${d.col}"][data-id="${d.id}"][data-field="${d.field}"]` : null;
    const sy = window.scrollY;
    refreshAll();
    if (sel) { const n = document.querySelector(sel); if (n) { n.focus(); if (n.type !== 'date') { try { n.select(); } catch (_) {} } } }
    window.scrollTo({ top: sy });
  }, 0);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
  const act = b.dataset.act, id = +b.dataset.id, col = b.dataset.col;

  if (act === 'goto') showSection(b.dataset.target);
  else if (act === 'add') openForm(col, null);
  else if (act === 'edit') openForm(col, id);
  else if (act === 'del') {
    const S = SCHEMA[col], rec = state[S.arr].find(x => x.id === id);
    if (!rec) return;
    openModal({ title: 'تأكيد الحذف', message: `هل تريد حذف «${S.nameOf(rec)}»؟ لا يمكن التراجع عن هذا الإجراء.`, submit: 'حذف', danger: true, onSubmit: () => removeRecord(col, id) });
  }
  else if (act === 'schedule') openForm('maint', null, { eqId: id });
  else if (act === 'calday') openForm('maint', null, { date: b.dataset.date });
  else if (act === 'calnav') { cal.m += +b.dataset.dir; if (cal.m < 0) { cal.m = 11; cal.y--; } if (cal.m > 11) { cal.m = 0; cal.y++; } renderEquipment(); }
  else if (act === 'maintdone') { const m = byId('maint', id); m.done = true; commit('تم تسجيل الصيانة كمنجزة'); }
  else if (act === 'restock') {
    const m = byId('materials', id);
    openModal({ title: `تزويد مخزون: ${m.name}`, fields: [{ name: 'qty', label: `الكمية المضافة (${m.unit})`, type: 'number', required: true, min: 0.1 }], submit: 'إضافة للمخزون',
      onSubmit: v => { m.qty = +(m.qty + +v.qty).toFixed(2); commit('تمت إضافة الكمية إلى المخزون'); } });
  }
  else if (act === 'order') { const m = byId('materials', id); openForm('orders', null, { matId: id, qty: suggestQty(m) }); }
  else if (act === 'receive') {
    const o = byId('orders', id), m = matOf(o.matId);
    openModal({ title: 'تأكيد استلام الطلب', message: `سيُضاف ${num(o.qty)} ${m.unit} من «${m.name}» إلى المخزون، ويُسجَّل مصروف بقيمة ${money(o.qty * m.price)} في بند المواد.`, submit: 'تأكيد الاستلام',
      onSubmit: () => {
        o.status = 'received'; m.qty = +(m.qty + o.qty).toFixed(2);
        const cat = state.categories.find(c => c.name.includes('مواد')) || state.categories[0];
        if (cat) state.expenses.push({ id: nid(state.expenses), date: iso(TODAY), desc: `توريد ${m.name} (${num(o.qty)} ${m.unit})`, cat: cat.id, amount: o.qty * m.price });
        commit('تم الاستلام وتحديث المخزون والمصاريف');
      } });
  }
  else if (act === 'copyorder') { copyText(orderText(byId('orders', id))).then(() => toast('تم نسخ نص الطلب، ألصقه في واتساب أو رسالة')); }
  else if (act === 'checkin') { const w = byId('workers', id); const n = new Date(); setWorkerStatus(w, n.getHours() * 60 + n.getMinutes() > 435 ? 'late' : 'present'); commit(`تم تسجيل حضور ${w.name}`); }
  else if (act === 'payroll') {
    const pr = payroll();
    openModal({ title: 'تسجيل أجور الأسبوع', message: `سيُسجَّل مصروف بقيمة ${money(pr.week)} في بند العمالة.`,
      fields: [{ name: 'date', label: 'التاريخ', type: 'date', required: true, value: iso(TODAY) }], submit: 'تسجيل المصروف',
      onSubmit: v => {
        const cat = state.categories.find(c => c.name.includes('عمال')) || state.categories[0];
        state.expenses.push({ id: nid(state.expenses), date: v.date, desc: `أجور الأسبوع المنتهي ${fs(v.date)}`, cat: cat.id, amount: pr.week });
        commit('تم تسجيل الأجور في الميزانية');
      } });
  }
  else if (act === 'editplan') {
    const fields = state.monthlyPlan.map((v, i) => {
      const mo = (CHART_START.m + i) % 12, yr = CHART_START.y + Math.floor((CHART_START.m + i) / 12);
      return { name: 'p' + i, label: `${MONTHS[mo]} ${yr} (بالملايين)`, type: 'number', min: 0, value: v };
    });
    openModal({ title: 'المصاريف الشهرية المخططة', fields, submit: 'حفظ', onSubmit: v => { state.monthlyPlan = state.monthlyPlan.map((_, i) => +v['p' + i] || 0); commit('تم تحديث المخطط الشهري'); } });
  }
  else if (act === 'settings') {
    const p = state.project;
    openModal({ title: 'بيانات المشروع', submit: 'حفظ', fields: [
      { name: 'name', label: 'اسم المشروع', required: true, value: p.name },
      { name: 'owner', label: 'صاحب المشروع', value: p.owner },
      { name: 'manager', label: 'مسؤول الموقع', value: p.manager },
      { name: 'today', label: 'تاريخ اليوم (اتركه فارغاً لاستعمال تاريخ الجهاز)', type: 'date', value: p.today }
    ], onSubmit: v => { state.project = { name: v.name.trim() || p.name, owner: v.owner.trim(), manager: v.manager.trim(), today: v.today || '' }; setToday(); commit('تم حفظ بيانات المشروع'); } });
  }
  else if (act === 'print') window.print();
  else if (act === 'export') exportCSV(b.dataset.key);
  else if (act === 'backup') { download(`نسخة-احتياطية-${iso(TODAY)}.json`, JSON.stringify(state, null, 2), 'application/json'); toast('تم تنزيل النسخة الاحتياطية'); }
  else if (act === 'import') $('#importFile').click();
  else if (act === 'reset') openModal({ title: 'إعادة البيانات الافتراضية', message: 'ستُحذف كل تعديلاتك وتعود البيانات التجريبية الأصلية. ننصحك بتنزيل نسخة احتياطية أولاً.', submit: 'إعادة الضبط', danger: true,
    onSubmit: () => { store.del(); state = defaults(); setToday(); commit('تمت إعادة البيانات الافتراضية'); } });
});

document.addEventListener('change', e => {
  const el = e.target;

  if (el.matches('input.cell')) {
    const { col, id, field } = el.dataset;
    const S = SCHEMA[col], rec = state[S.arr].find(x => x.id === +id);
    if (!rec) return;
    const f = S.fields().find(x => x.name === field) || {};
    let v = el.value;
    if (el.type === 'number') { v = v === '' ? 0 : +v; if (f.min !== undefined) v = Math.max(f.min, v); if (f.max !== undefined) v = Math.min(f.max, v); }
    else if (el.type === 'date') v = v || (f.nullable ? null : rec[field]);
    else v = v.trim();
    rec[field] = v;
    if (S.after) S.after(rec);
    save(); deferredRefresh();
    return;
  }

  if (el.matches('select[data-act="wstatus"]')) { const w = byId('workers', +el.dataset.id); setWorkerStatus(w, el.value); commit(); return; }
  if (el.matches('select[data-act="setfield"]')) {
    const S = SCHEMA[el.dataset.col], rec = state[S.arr].find(x => x.id === +el.dataset.id);
    rec[el.dataset.field] = el.dataset.int ? +el.value : el.value;
    commit(); return;
  }
  if (el.id === 'importFile') {
    const file = el.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o || o.v !== 2 || !Array.isArray(o.workers) || !Array.isArray(o.materials)) throw new Error('bad');
        state = o; setToday(); commit('تم استرجاع النسخة الاحتياطية');
      } catch (err) { toast('الملف غير صالح. اختر نسخة احتياطية أنشأها هذا الموقع.'); }
      el.value = '';
    };
    r.readAsText(file);
  }
});

$$('.nav-btn').forEach(b => {
  const n = NAV[b.dataset.target];
  b.className = 'nav-btn w-full flex items-center gap-3 px-5 py-3 text-sm font-medium text-steel-300 border-s-4 border-transparent hover:bg-steel-700 hover:text-white text-start';
  b.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${n.icon}</svg><span>${n.label}</span>`;
  b.addEventListener('click', () => showSection(b.dataset.target));
});

function showSection(id) {
  if (!NAV[id]) id = 'overview';
  $$('.section').forEach(s => s.classList.toggle('hidden', s.id !== id));
  $$('.nav-btn').forEach(b => {
    const on = b.dataset.target === id;
    b.classList.toggle('!border-hivis', on);
    b.classList.toggle('bg-steel-700', on);
    b.classList.toggle('!text-white', on);
    b.setAttribute('aria-current', on ? 'page' : 'false');
  });
  $('#pageTitle').textContent = NAV[id].label;
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  closeMenu();
  window.scrollTo({ top: 0 });
}

const sidebar = $('#sidebar'), scrim = $('#scrim');
function openMenu() { sidebar.classList.remove('translate-x-full'); scrim.classList.remove('hidden'); }
function closeMenu() { sidebar.classList.add('translate-x-full'); scrim.classList.add('hidden'); }
$('#menuBtn').addEventListener('click', openMenu);
scrim.addEventListener('click', closeMenu);

/* =====================================================
   التشغيل
   ===================================================== */
cal = { y: TODAY.getFullYear(), m: TODAY.getMonth() };
refreshAll();
firstPaint = false;
save();
showSection(location.hash.slice(1) || 'overview');
</script>
